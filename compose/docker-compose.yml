name: local-ai-stack
services:
  # Enable this if you have obsidian second-brain
  # second-brain-mcp:
  #   container_name: second-brain
  #   image: node:24-alpine
  #   command:
  #     - npx
  #     - -y
  #     - "@modelcontextprotocol/server-filesystem"
  #     - --transport
  #     - streamable-http
  #     - /vault
  #   environment:
  #     HOST: "0.0.0.0"
  #     PORT: "3001"
  #   volumes:
  #     - type: bind
  #       source: ${SECOND_BRAIN_PATH:-}
  #       target: /vault
  #   restart: unless-stopped
  db:
    container_name: litellm-DB
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  litellm:
    container_name: litellm
    image: docker.litellm.ai/berriai/litellm:latest
    ports:
      - "${LITELLM_BIND:-}${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?.env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?.env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
    volumes:
      - ../config/litellm_config.yaml:/app/config.yaml:ro
      - ../config/custom_callbacks.py:/app/custom_callbacks.py:ro
      - ../config/prompts:/app/prompts:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
      # second-brain-mcp:
      #   condition: service_started

  litellm-init:
    container_name: litellm-init
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      - litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?.env}
      ADMIN_USER_ID: ${ADMIN_USER_ID:?.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env}
      OPENWEBUI_LITELLM_KEY: ${OPENWEBUI_LITELLM_KEY:?.env}
    volumes:
      - ../scripts/litellm-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  open-webui:
    container_name: openwebui
    image: ghcr.io/open-webui/open-webui:slim
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      WEBUI_AUTH: "False"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?.env}
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${OPENWEBUI_LITELLM_KEY:?.env}
      ENABLE_OLLAMA_API: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      TOOL_SERVER_CONNECTIONS: >-
        [{"id":"second_brain","type":"mcp",
        "url":"http://litellm:4000/mcp","path":"",
        "auth_type":"bearer","key":"${OPENWEBUI_LITELLM_KEY}","config": { "enable": true },
        "config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},
        "info":{"id":"second_brain","name":"second_brain","description":"second_brain obsidian MCP via LiteLLM"}}]
    restart: unless-stopped
    depends_on:
      litellm-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  open-webui:
